# Runs every test group, the typecheck and the public leak check on an Apple-silicon Mac, the only kind Atrium supports.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      # Some tests commit in throwaway repos without an identity of their own; a fresh runner has none to fall back on.
      - name: Set a git identity for test commits
        run: |
          git config --global user.name "Atrium CI"
          git config --global user.email "ci@example.com"
      - run: bun install --frozen-lockfile
      - name: Engine
        run: bun test tests/engine --timeout 120000
      - name: Server and dashboard
        run: bun test tests/server tests/dashboard
      - name: Terminal app and copy
        run: bun test tests/tui tests/copy
      - name: CLI and main
        run: bun test tests/cli.test.ts tests/main.test.ts
      - name: End to end
        run: bun test tests/e2e
      - name: Mac app
        run: bun test tests/mac
      - name: Typecheck
        run: bunx tsc --noEmit
      # Without a denylist it checks the generic patterns: home-folder paths, real-looking emails and phone numbers, tokens.
      - name: Leak check
        run: bun run leak-check
